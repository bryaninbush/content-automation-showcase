<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Automation</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Internal Tool</p>
          <h1>Content Automation</h1>
        </div>
        <button id="refresh">Refresh</button>
      </header>

      <section class="grid">
        <article class="panel">
          <h2>Session</h2>
          <pre id="session">Loading...</pre>
        </article>

        <article class="panel">
          <h2>gws Login</h2>
          <p>Operator 環境使用以下指令登入 Google Workspace。</p>
          <code id="gws-command">Loading...</code>
        </article>

        <article class="panel wide">
          <h2>Clients</h2>
          <form id="client-form">
            <input name="name" placeholder="Client name" required />
            <input name="googleFolderId" placeholder="Google folder ID" />
            <input name="sheetId" placeholder="Sheet ID" />
            <button type="submit">Add Client</button>
          </form>
          <div id="clients" class="list"></div>
        </article>

        <article class="panel wide">
          <h2>Jobs</h2>
          <form id="job-form">
            <input name="clientId" placeholder="Client ID" required />
            <select name="scope">
              <option value="selected">Selected rows</option>
              <option value="non-product">Non-product only</option>
              <option value="all">All rows</option>
            </select>
            <input name="rows" placeholder="Rows e.g. 3,5,7" />
            <input name="notes" placeholder="Notes" />
            <button type="submit">Create Job</button>
          </form>
          <div id="jobs" class="list"></div>
        </article>

        <article class="panel wide">
          <h2>Knowledge</h2>
          <form id="knowledge-form" class="knowledge-form">
            <input name="clientId" placeholder="Client ID" required />
            <select name="type">
              <option value="brand-context">Brand context</option>
              <option value="product-info">Product info</option>
              <option value="target-audience">Target audience</option>
              <option value="writing-style">Writing style</option>
            </select>
            <input name="sourceFileId" placeholder="Source file ID" />
            <textarea name="content" placeholder="Knowledge content" required></textarea>
            <button type="submit">Save Knowledge</button>
          </form>
          <div class="lookup-row">
            <input id="knowledge-client-id" placeholder="Client ID" />
            <button id="load-knowledge" type="button">Load Knowledge</button>
          </div>
          <div id="knowledge" class="list"></div>
        </article>

      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
