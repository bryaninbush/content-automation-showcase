apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: content-automation
spec:
  template:
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/REPOSITORY/content-automation:TAG
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_POOL_MAX
              value: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: content-automation-database-url
                  key: latest
