services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: content_automation
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
